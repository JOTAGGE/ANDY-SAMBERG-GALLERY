<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="45%" stop-color="#F5D800"/>
      <stop offset="100%" stop-color="#C98A00"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2942"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Gold Shield Frame -->
  <path d="M32 3 L55 10 C55 35 46 53 32 61 C18 53 9 35 9 10 Z" fill="url(#badgeGold)" filter="url(#shadow)"/>

  <!-- Inner Shield Fill -->
  <path d="M32 7 L51 13 C51 34 43 49 32 56 C21 49 13 34 13 13 Z" fill="url(#shieldBg)"/>

  <!-- Gold Star Crest -->
  <polygon points="32,15 33.8,19 38,19.4 34.8,22.2 35.7,26.4 32,24.2 28.3,26.4 29.2,22.2 26,19.4 30.2,19" fill="#FFE57F"/>

  <!-- 99 Emblem -->
  <text x="32" y="47" text-anchor="middle" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Arial Black', sans-serif" font-weight="900" fill="url(#badgeGold)" letter-spacing="-1.5">99</text>
</svg>
